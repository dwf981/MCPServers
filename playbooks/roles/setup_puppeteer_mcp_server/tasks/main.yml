---
- name: Install dependencies and build Puppeteer MCP Server project
  shell: |
    if [ ! -f "{{ repo_dest }}/src/puppeteer/dist/index.js" ]; then
      echo "Installing dependencies for Puppeteer MCP Server project..."
      cd "{{ repo_dest }}/src/puppeteer" || exit 1
      pnpm install || exit 1
      pnpm run build || exit 1
      echo "Puppeteer MCP Server built successfully."
    else
      echo "Puppeteer MCP Server already built."
    fi
  args:
    executable: /bin/bash 